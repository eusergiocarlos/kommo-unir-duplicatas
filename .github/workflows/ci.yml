# CI: lint, testes (Windows + Linux), segurança e documentação.
# Explicação completa, limitações e o que depende do dono: docs/operations/ci-cd.md
#
# Actions fixadas por versão MAJOR (@v4, @v5...). Antes da 1ª release pública, recomenda-se fixar por SHA
# completo do commit (o Dependabot mantém os SHAs atualizados) — ver docs/operations/ci-cd.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reutilizado por release.yml (mesmos testes antes de qualquer build de release).
  workflow_call:
    secrets:
      KOMMO_TERMOS_SENSIVEIS:
        description: "Termos sensíveis extras (vírgulas) para scripts/verificar_privacidade.py"
        required: false

# Mínimo necessário: só ler o código. Nenhum job deste arquivo escreve no repositório.
permissions:
  contents: read

# Cancela execuções antigas do MESMO ref (ex.: novo push no PR). Prefixo fixo "ci-" para não colidir com o
# grupo do release.yml quando este arquivo é chamado por ele (github.workflow seria o do chamador).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"        # runner limpo: nada de __pycache__ (contém caminho absoluto)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"                     # saída com acentos no console do Windows

jobs:
  # ------------------------------------------------------------------------------------------------ lint
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff (versão fixa)
        run: python -m pip install "ruff==0.17.0"
      - name: ruff check (regras em pyproject.toml)
        run: ruff check --output-format=github .
      # Informativo: o projeto ainda não adotou `ruff format` (reformataria ~30 arquivos). Não bloqueia.
      - name: ruff format --check (informativo, não bloqueia)
        continue-on-error: true
        run: ruff format --check --diff .

  # ------------------------------------------------------------------------------------------------ testes
  testes:
    name: testes (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Todas as versões BLOQUEIAM o CI. 3.14 é a versão do lock (requirements*.lock) e do build de release, por isso
    # não é mais "experimental" (ver ci-cd.md). 3.12/3.13 continuam para quem roda pelo código-fonte.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash          # Git Bash no Windows: o mesmo script nos dois sistemas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-dev.txt

      # O lock (versões exatas + hashes) é resolvido para UMA versão do Python (cabeçalho do arquivo).
      # - Mesma versão → instalação ESTRITA com --require-hashes (falhou = CI falha).
      # - Outra versão → tenta o lock; se não instalar (ex.: wheel inexistente para essa versão), cai para
      #   requirements-dev.txt (faixas abertas) com aviso. Assim a matriz não quebra por causa do lock,
      #   mas a versão de referência continua 100% reprodutível.
      - name: Instalar dependências (lock com hashes ou requirements-dev.txt)
        run: |
          set -euo pipefail
          lock_py="$(sed -n 's/.*autogenerated by pip-compile with Python \([0-9][0-9.]*\).*/\1/p' requirements-dev.lock | head -n1)"
          atual="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "Lock gerado com Python ${lock_py:-?}; este job usa Python ${atual}."
          if [ "$lock_py" = "$atual" ]; then
            python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          elif python -m pip install --require-hashes --no-deps -r requirements-dev.lock; then
            echo "::notice::Python ${atual}: lock (gerado com ${lock_py}) instalou normalmente com --require-hashes."
          else
            echo "::warning::Python ${atual}: o lock (gerado com ${lock_py}) não instalou; usando requirements-dev.txt (versões abertas, NÃO reproduzível)."
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip check || echo "::warning::pip check apontou inconsistências (ver log acima)."

      # Chromium do Playwright para os testes REAIS de JS (tests/test_privacy_js.py, tests/test_kommo_js.py).
      # Sem ele esses testes seriam pulados em silêncio. No Linux, --with-deps instala as bibliotecas do sistema.
      - name: Instalar Chromium do Playwright
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      # Tk precisa de display no Linux (tests/test_ui_pura.py abre a janela de verdade).
      - name: Garantir xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }

      # Cobertura quando pytest-cov estiver instalado (está em requirements-dev.in/.lock). Se a instalação cair
      # para um ambiente sem ele, roda os testes normalmente, sem cobertura.
      - name: pytest
        run: |
          set -euo pipefail
          args=(-q -p no:cacheprovider -rs)
          if python -c "import pytest_cov" 2>/dev/null; then
            args+=(--cov --cov-report=term-missing --cov-report=xml:coverage.xml)
          else
            echo "::notice::pytest-cov não instalado neste ambiente: testes sem cobertura."
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest "${args[@]}"
          else
            python -m pytest "${args[@]}"
          fi

      - name: Publicar relatório de cobertura (se gerado)
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------------------------------------ segurança
  seguranca:
    name: segurança (pip-audit, segredos, privacidade)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de auditoria (versões fixas, fora do projeto)
        run: python -m pip install "pip-audit==2.10.1" "detect-secrets==1.5.0"

      # --disable-pip: audita as versões EXATAS do lock sem instalar nada (o lock tem hashes).
      # --strict: pacote que não puder ser auditado também falha.
      - name: pip-audit (requirements.lock e requirements-dev.lock)
        run: |
          pip-audit --strict --disable-pip --progress-spinner off -r requirements.lock
          pip-audit --strict --disable-pip --progress-spinner off -r requirements-dev.lock

      # detect-secrets (PyPI, sem token nem licença). Varre a árvore atual; o relatório tem só tipo, arquivo e
      # linha (o valor do segredo NÃO é impresso, só um hash). Ver ci-cd.md (por que não gitleaks-action).
      - name: Procurar segredos (detect-secrets)
        run: |
          set -euo pipefail
          detect-secrets scan --all-files \
            --exclude-files '(^|/)(\.git|\.venv|dist|build)/' > "$RUNNER_TEMP/segredos.json"
          python - "$RUNNER_TEMP/segredos.json" <<'PY'
          import json, sys
          dados = json.load(open(sys.argv[1], encoding="utf-8"))
          achados = [(arq, r["type"], r["line_number"]) for arq, lista in dados["results"].items() for r in lista]
          for arq, tipo, linha in achados:
              print(f"::error file={arq},line={linha}::possível segredo ({tipo})")
          print(f"{len(achados)} possível(is) segredo(s).")
          sys.exit(1 if achados else 0)
          PY

      # Modo PROJETO do verificador. No runner, os termos "do sistema" (usuário/host/home do runner) não
      # identificam ninguém e dariam falso positivo (ex.: "runner"), por isso --sem-termos-padrao.
      # Sempre há um termo-sentinela ALEATÓRIO (nunca existe nos arquivos), para que as checagens estruturais
      # (data/, logs, artefatos fora de dist/, arquivos ilegíveis) rodem mesmo sem termos configurados.
      # Termos reais (ex.: nome da empresa): SECRET KOMMO_TERMOS_SENSIVEIS (recomendado: valor mascarado no log)
      # ou VARIÁVEL de repositório de mesmo nome (aparece em claro no log — ver ci-cd.md).
      - name: Verificador de privacidade (modo projeto)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          KOMMO_TERMOS_SENSIVEIS: ${{ secrets.KOMMO_TERMOS_SENSIVEIS || vars.KOMMO_TERMOS_SENSIVEIS }}
        run: |
          set -euo pipefail
          if [ -z "${KOMMO_TERMOS_SENSIVEIS:-}" ]; then
            echo "::notice::KOMMO_TERMOS_SENSIVEIS não configurado (ou indisponível neste evento, ex.: PR de fork/Dependabot): só checagens estruturais."
          fi
          sentinela="sentinela-ci-$(python -c 'import secrets; print(secrets.token_hex(8))')"
          python -B scripts/verificar_privacidade.py --sem-termos-padrao --termo "$sentinela"
          test ! -e scripts/__pycache__ || { echo "::error::__pycache__ criado em scripts/"; exit 1; }

  # Revisão de dependências novas/alteradas no PR (vulnerabilidades conhecidas). Requer o "Dependency graph"
  # ativo no repositório (em repositório privado exige GitHub Advanced Security — ver ci-cd.md).
  revisao-dependencias:
    name: revisão de dependências (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ------------------------------------------------------------------------------------------------ docs
  docs:
    name: docs (links relativos)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links relativos em Markdown
        run: python -B .github/scripts/verificar_links.py
